name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clinic_ci?schema=public
      NEXTAUTH_SECRET: ci-only-nextauth-secret-at-least-32-characters
      RATE_LIMIT_PEPPER: ci-only-rate-limit-pepper-at-least-32-characters
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters
      DEPLOYMENT_ENV: ci
      NEXT_DIST_DIR: .next-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate --schema packages/db/prisma/schema.prisma
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
